# KBFlow LLM 配置示例
#
# 使用方法（任选其一）：
#   1. 最简单：运行 `python kbflow.py config`，交互式填入即可自动生成配置文件
#   2. 手动：复制本文件为 ~/.kbflow/config.ini（Linux/Mac）或 %USERPROFILE%\.kbflow\config.ini（Windows），
#      然后把下面 api_key 换成你自己的 key
#
# 说明：KBFlow 的 K01 扫描是纯脚本，不需要 LLM；从 K02 领域划分起才需要调 LLM。
#      任何「OpenAI 兼容接口」都能用（OpenAI 官方、DeepSeek、各类中转服务），
#      只需保证 api_key / base_url / model 三者指向同一个服务。

[llm]

# 必填：你的 LLM 服务 API Key
api_key = 在这里填入你的key

# 服务地址（可选，默认 OpenAI 官方）
#   OpenAI 官方: https://api.openai.com/v1
#   DeepSeek:    https://api.deepseek.com/v1
#   其他中转:    填该服务提供的接口地址
base_url = https://api.openai.com/v1

# 模型名（可选，默认 gpt-4o-mini），填你所用服务支持的「API 模型名」（小写连字符）
# ⚠ 注意：填 API 模型名（如 deepseek-v4-pro），不是界面显示名（如 "DeepSeek V4 Pro"）
#   OpenAI:   gpt-4o / gpt-4o-mini
#   DeepSeek: deepseek-chat / deepseek-reasoner / deepseek-v4-pro / deepseek-v4-flash
model = gpt-4o-mini
